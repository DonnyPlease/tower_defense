name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run it by hand from the Actions tab

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.4.1

jobs:
  test:
    name: Unit, scene and phone tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      # The scene and phone tests draw real frames in a virtual display.
      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri
      # Also compiles every script with the strict typing rules (tests/unit/test_scripts.gd)
      # and fails on any script or engine error.
      - run: tests/run.sh

  balance:
    name: Balance (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: best strategy wins every level
            filter: best_strategy
          - name: Meadow and endless
            filter: meadow_tutorial,without_losing,endless_runs
          - name: Riverside
            filter: riverside_is
          - name: Highlands
            filter: highlands_is
          - name: Open Field
            filter: openfield_is
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - run: tests/run.sh balance --filter=${{ matrix.filter }}

  screenshots:
    name: Render every screen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri
      - name: Render
        run: |
          "$GODOT" --headless --import >/dev/null 2>&1 || true
          xvfb-run -a -s "-screen 0 1500x900x24" "$GODOT" --rendering-driver opengl3 --audio-driver Dummy \
            --path . res://tools/screenshots.tscn -- "$PWD/screenshots" 2>&1 | tee render.log
          ls screenshots/*.png
          if grep -E "SCRIPT ERROR|^ERROR:" render.log; then exit 1; fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
