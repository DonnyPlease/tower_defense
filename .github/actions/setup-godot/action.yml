name: Set up Godot
description: Downloads the Godot editor for Linux (cached) and sets GODOT to its path.
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ env.GODOT_VERSION }}-linux
    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -sSLf -o "$RUNNER_TEMP/godot.zip" \
          "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot
    - name: Use Godot
      shell: bash
      run: |
        echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
        "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version
